<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>GRAFIQ Clipper settings</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="options">
  <header><div class="brand"><span class="mark">G</span> GRAFIQ Clipper</div></header>
  <main>
    <h1 id="title"></h1>
    <p id="intro"></p>
    <form id="form" class="grid">
      <div class="full"><label id="appUrlLabel" for="appUrl"></label><input id="appUrl" placeholder="https://grafiq-os.vercel.app" /></div>
      <div><label id="langLabel" for="lang"></label><select id="lang"><option value="en">English</option><option value="cs">Čeština</option></select></div>
      <div class="full row"><button type="submit" id="save"></button><span id="msg" class="msg"></span></div>
    </form>
  </main>
  <script src="i18n.js"></script>
  <script src="options.js"></script>
</body>
</html>
